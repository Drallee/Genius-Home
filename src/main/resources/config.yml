configVersion: '1.0.0'

# Language file loaded from plugins/Genius-Homes/language/<language>.yml.
# Only en_US.yml is bundled by default. Server owners can add their own files.
language: en_US

settings:
  debug: false
  update-checker: true
  bstats: true
  mysql:
    use: false
    table-prefix: homes
    host: localhost
    port: 3306
    database: database
    username: root
    password: password
  homes:
    per-world: false
    need-permission: true
    max-amount: 28
    names:
      min-length: 1
      max-length: 32
      # Java regex. Default allows letters, numbers, underscores, and hyphens.
      allowed-pattern: '^[A-Za-z0-9_-]+$'
    rename-permission: false
    sound-permission: false
    per-sound-permission: false
    teleport:
      unsafe: false
      cooldown:
        enabled: true
        cancel-on-move: true
        time: 5
      cost:
        enabled: false
        type: XP # Options: VAULT, XP, LEVEL, ITEM
        item: DIAMOND
        amount: 10
