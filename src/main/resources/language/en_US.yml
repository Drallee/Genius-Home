configVersion: '1.0.0'

chat:
  prefix:
    home: '&9&lHOME &7>'
    error: '&4&lERROR &7>'
  message:
    player:
      home:
        amount: '%chat_prefix% &eYou currently have &b%current%&7/&c%max% &ehome(s)'
        set: '%chat_prefix% &aYour home %home% has been set to: &cx: &b%x% &cy: &e%y% &cz: &b%z%'
        deleted: '%chat_prefix% &cDeleting your home %home%'
        name-changed: '%chat_prefix% &aYour &e%old% &aname has been changed to &b%new%'
        location-updated: '%chat_prefix% &aHome location updated!'
        sound-changed: '%chat_prefix% &aTeleport sound has been changed for your home &b%home%'
        icon-changed: '%chat_prefix% &aIcon has been changed for your home &b%home%'
        teleporting: '%chat_prefix% &eTeleporting you to your home &b%home%'
        teleporting-other: '%chat_prefix% &eTeleporting you to &b%target%''s&r &ehome &b%home%'
        others:
          amount: '%chat_prefix% &b%target% &ecurrently have &b%current% &ehome(s)'
    error:
      player:
        teleport:
          cooldown: '%chat_prefix% &eTeleporting in &b%time% &eseconds... Don''t move!'
          cancelled: '%chat_prefix% &cTeleportation cancelled due to movement.'
          insufficient-funds: '%chat_prefix% &cInsufficient funds! You need %amount% %currency%.'
          insufficient-xp: '%chat_prefix% &cInsufficient XP! You need %amount% XP.'
          insufficient-levels: '%chat_prefix% &cInsufficient levels! You need %amount% levels.'
          insufficient-items: '%chat_prefix% &cInsufficient items! You need %amount% %item%.'
          paid: '%chat_prefix% &aYou paid %amount% %currency% to teleport.'
          paid-xp: '%chat_prefix% &aYou paid %amount% XP to teleport.'
          paid-levels: '%chat_prefix% &aYou paid %amount% levels to teleport.'
          paid-item: '%chat_prefix% &aYou paid %amount% %item% to teleport.'
          location-not-found: '%chat_prefix% &cHome location not found!'
          unsafe-location: '%chat_prefix% &cTeleport destination is unsafe!'
        command:
          player-not-found: '%chat_prefix% &cPlayer does not exist.'
          no-permission: '%chat_prefix% &cYou do not have the right permission.'
          only-players: '&cOnly players can use this command.'
          usage: '&cUsage: %usage%'
          max-homes: '%chat_prefix% &cYou have reached the maximum amount of homes (%max%)'
          config-reloaded: '&aConfiguration reloaded and home cache cleared!'
        home:
          not-found: '%chat_prefix% &cSeems like you do not have a home named %home%'
          already-exists: '%chat_prefix% &cSeems like you already have a home named %home%'
          invalid-name: '%chat_prefix% &cThat home name is invalid.'
          name-empty: '%chat_prefix% &cHome name cannot be empty.'
          name-too-short: '%chat_prefix% &cHome name must be at least %min% character(s).'
          name-too-long: '%chat_prefix% &cHome name cannot be longer than %max% character(s).'
          name-invalid-characters: '%chat_prefix% &cHome names can only contain letters, numbers, underscores, and hyphens.'
          name-same: '%chat_prefix% &cNew name matches the old name.'
          rename-usage: '&cTo change the name of your home, use &e/home-rename %home% (new name)'
          others:
            not-found: '%chat_prefix% &cSeems like %target% does not have a home named %home%'

