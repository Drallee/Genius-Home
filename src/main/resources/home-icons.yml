configVersion: '1.0.0'

# Controls the icons players can choose for homes.
#
# Valid material names must match Bukkit/Paper Material enum names.
# The first PLAYER_HEAD entry opens the player-head selection menu.
#
# Text colors support:
# - Legacy colors: '&aGreen', '&lBold'
# - Hex colors: '#55AAFFText', '&#55AAFFText', or '<#55AAFF>Text'
# - Gradients: '<gradient:#55AAFF:#FF55FF>Gradient Text</gradient>'
# - Multi-gradients: '<gradient:#55AAFF:#FFFFFF:#FF55FF>Gradient Text</gradient>'
icons:
  # Player names that appear in the player-head icon menu.
  # These are used as skull owners.
  player_heads:
    - Drallee

  # Order here is the order shown in the icon selection menu.
  material:
    # Special
    - name: PLAYER_HEAD
      display_name: '&bPlayer Heads'

    - name: ENCHANTED_BOOK
      display_name: '&eEnchanted Book'

    # Beds
    - name: WHITE_BED
      display_name: '&fWhite Bed'

    - name: LIGHT_GRAY_BED
      display_name: '&7Light Gray Bed'

    - name: GRAY_BED
      display_name: '&8Gray Bed'

    - name: BLACK_BED
      display_name: '&0Black Bed'

    - name: BROWN_BED
      display_name: '&6Brown Bed'

    - name: RED_BED
      display_name: '&cRed Bed'

    - name: ORANGE_BED
      display_name: '&6Orange Bed'

    - name: YELLOW_BED
      display_name: '&eYellow Bed'

    - name: LIME_BED
      display_name: '&aLime Bed'

    - name: GREEN_BED
      display_name: '&2Green Bed'

    - name: CYAN_BED
      display_name: '&3Cyan Bed'

    - name: LIGHT_BLUE_BED
      display_name: '&bLight Blue Bed'

    - name: BLUE_BED
      display_name: '&1Blue Bed'

    - name: PURPLE_BED
      display_name: '&5Purple Bed'

    - name: MAGENTA_BED
      display_name: '&dMagenta Bed'

